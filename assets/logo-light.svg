<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="PoGoBot — Pokemon GO Vision Bot">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00e676" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00e676" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="30" y="30" width="140" height="140" rx="30"/></clipPath>
  </defs>

  <!-- mark: a detection reticle, the bot's own visual language -->
  <rect x="30" y="30" width="140" height="140" rx="30" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g clip-path="url(#cardClip)">
    <!-- map grid -->
    <g stroke="#1f6feb" stroke-opacity="0.35" stroke-width="2">
      <path d="M30 78 L170 62"/><path d="M30 118 L170 102"/><path d="M30 158 L170 142"/>
      <path d="M62 30 L78 170"/><path d="M110 30 L126 170"/>
    </g>
    <!-- scanline -->
    <rect x="30" y="96" width="140" height="3" fill="url(#scan)"/>
  </g>

  <!-- target -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="#00e676" stroke-width="4"/>
  <circle cx="100" cy="100" r="6"  fill="#f85149"/>
  <g stroke="#00e676" stroke-width="4" stroke-linecap="round">
    <path d="M100 58 V72"/><path d="M100 128 V142"/>
    <path d="M58 100 H72"/><path d="M128 100 H142"/>
  </g>

  <!-- corner brackets: the bounding box -->
  <g stroke="#22d3ee" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M52 74 V58 H68"/>
    <path d="M132 58 H148 V74"/>
    <path d="M148 126 V142 H132"/>
    <path d="M68 142 H52 V126"/>
  </g>

  <!-- wordmark -->
  <text x="206" y="106" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="700" fill="#1f2328" letter-spacing="-1.5">PoGoBot</text>
  <text x="210" y="140" font-family="'SF Mono',Menlo,Consolas,monospace"
        font-size="19" font-weight="500" fill="#656d76" letter-spacing="4.2">POKÉMON GO VISION BOT</text>
</svg>
